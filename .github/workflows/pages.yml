name: Pages

# The submitted URL. Runs after CI passes on main, and by hand once scripts/publish_bundle.py has uploaded a
# new bundle. CI has no SoccER data, so the bundle comes from the "bundle" release, exported locally.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Static bundle from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download bundle --pattern bundle.tar.gz --dir "$RUNNER_TEMP"
          mkdir -p public/bundle
          tar -xzf "$RUNNER_TEMP/bundle.tar.gz" -C public/bundle
      # Offline mode reads the same schemas as the API, so a bundle from another contract would break silently.
      - name: The bundle matches this build's contract
        run: |
          bundle=$(jq -r .contract_version public/bundle/manifest.json)
          code=$(jq -r .info.version ../contracts/openapi.json)
          if [ "$bundle" != "$code" ]; then
            echo "::error::The bundle is contract $bundle and the code $code: run scripts/publish_bundle.py"
            exit 1
          fi
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_BASE: /filmroom/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
