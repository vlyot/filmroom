name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Includes the contract drift check; tests that need the SoccER data skip without DATA_DIR.
      - run: uv run pytest -q -rs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated types match contracts/schema.json
        run: npm run gen:contracts && git diff --exit-code src/contracts.ts
      - run: npm run lint
      - run: npm run typecheck
      # Includes the parity tests: the browser's style scoring and slot filling against contracts/parity.json.
      - run: npm test
      - run: npm run build
